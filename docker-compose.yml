services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DIST_DIR: "./dist"

      # ── SMTP ───────────────────────────────────────────────────────────
      # Copy .env.example → .env and fill in your credentials,
      # or set these directly here / via a secrets manager.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TO_EMAIL:  ${TO_EMAIL:-hello@nexuslab.io}

      # ── CORS ───────────────────────────────────────────────────────────
      # In production, set this to your domain: https://nexuslab.io
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
